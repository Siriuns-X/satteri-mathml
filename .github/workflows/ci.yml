name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - run: pnpm build
      - run: pnpm test
      