name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/setup@v1
        with:
          cache: true

      - name: Check tag matches package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      
      - run: npm --version
      - run: pnpm build
      - run: pnpm test

      - run: npx -y npm@11 --version
      - run: npx -y npm@11 stage publish --access public